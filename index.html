<!doctype html>
<html lang="el">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="canonical" href="https://simintzisxaris.github.io/" />
        <title>Site under construction</title>
        <style>
            body {
                background: linear-gradient(to right, #f39c12, #e67e22);
                margin: 0;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                color: #fff;
            }
            .container {
                background-color: rgba(0, 0, 0, 0.7);
                padding: 40px;
                border-radius: 20px;
                text-align: center;
                box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            }
            h1 {
                font-size: 32px;
                margin-bottom: 10px;
            }
            p {
                font-size: 18px;
            }
            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            @media (max-width: 600px) {
                .container {
                    padding: 20px;
                }
                h1 {
                    font-size: 24px;
                }
                p {
                    font-size: 16px;
                }
            }
            .gear {
                width: 250px;
                height: 250px;
                fill: #a9a9a9;
                animation: spin 5s linear infinite;
                transform-origin: center center;
            }
            .gear path {
                stroke: #333;
                stroke-width: 10;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <svg xmlns="http://www.w3.org/2000/svg" class="gear" viewBox="0 0 640 640">
                <path
                    d="M259 74c3-15 16-26 31-26h60c15 0 29 11 32 26l14 70c14 6 27 13 39 22l68-22c15-5 30 1 38 14l30 52c7 13 5 30-7 40l-53 47a188 188 0 0 1 0 46l53 47c12 10 14 27 7 40l-30 52c-8 13-23 19-38 14l-68-22c-12 9-25 17-39 23l-14 70c-3 14-16 25-32 25h-59c-16 0-29-11-32-25l-14-70c-14-6-27-14-39-23l-68 22c-15 5-31-1-38-14l-30-52c-8-13-5-30 6-40l54-47a188 188 0 0 1 0-46l-54-47a32 32 0 0 1-6-40l30-52c7-13 23-19 38-14l67 22c12-9 26-16 40-23l14-69zm61 326a80 80 0 1 0 0-160 80 80 0 0 0 0 160z" />
            </svg>
            <h1>Site under construction</h1>
        </div>
    </body>
</html>
